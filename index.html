        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Swaip?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Swaip is a free couple decision app that helps you and your partner agree on what to watch, where to eat, or what to do — without endless back-and-forth. Both of you swipe on options independently, and Swaip instantly reveals what you both liked."

            },
            {
              "@type": "Question",
              "name": "How does Swaip work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pick a category (movies, restaurants, TV series, or activities), share the room link with your partner via text or WhatsApp, both swipe independently on your own phones, and Swaip instantly shows only what you both agreed on."
              }
            },
            {
              "@type": "Question",
              "name": "Is Swaip free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Swaip is completely free with no sign-up or account required. Just open the app, create a room, and share the link."
              }
            },
            {
              "@type": "Question",
              "name": "What can couples use Swaip to decide?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Swaip helps couples decide on: movies to watch together, TV series to binge, restaurants and cuisines for dinner, activities and places to visit nearby, and conversation topics for deeper connection."

              "name": "Do both people need to download an app?",
