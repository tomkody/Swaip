name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is informational for now — the repo has known pre-existing
      # react-hooks findings. Remove continue-on-error once those are cleared
      # to make lint a hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
